# Keybindings for i3 / Sway window managers
# Add to ~/.config/i3/config or ~/.config/sway/config

# Toggle Jarheart on/off
bindsym $mod+Shift+n exec --no-startup-id jarheart toggle

# Pause for 1 hour (e.g. for color-sensitive graphics work or movies)
bindsym $mod+Shift+p exec --no-startup-id jarheart pause 1h

# Resume normal automatic transition
bindsym $mod+Shift+r exec --no-startup-id jarheart resume
