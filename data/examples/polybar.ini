; Polybar module configuration for Jarheart
; Add "jarheart" to your modules list (e.g. modules-right = ... jarheart ...)

[module/jarheart]
type = custom/script
exec = jarheart status --json | grep -Po '"text": "\K[^"]*'
interval = 5
format-prefix = " "
click-left = jarheart toggle
click-right = jarheart pause 1h
click-middle = jarheart resume
scroll-up = jarheart set 4500
scroll-down = jarheart set 3200
