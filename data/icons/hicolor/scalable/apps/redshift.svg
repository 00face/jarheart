<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="jar_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="heart_glow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>
    <filter id="ambient_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glass Jar Body -->
  <rect x="15" y="18" width="34" height="40" rx="10" ry="10" fill="url(#jar_glass)" stroke="#94a3b8" stroke-width="1.8" />
  <!-- Jar Neck & Rim -->
  <rect x="20" y="13" width="24" height="5" rx="2" fill="#64748b" stroke="#475569" stroke-width="1.2" />
  <rect x="18" y="10" width="28" height="4" rx="2" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- Circadian Heart Inside Jar -->
  <g filter="url(#ambient_glow)">
    <path d="M 32 46 C 32 46 20 37 20 28 C 20 23 23.5 19.5 28 19.5 C 30.5 19.5 32 21 32 21 C 32 21 33.5 19.5 36 19.5 C 40.5 19.5 44 23 44 28 C 44 37 32 46 32 46 Z"
          fill="url(#heart_glow)" />
    <!-- Specular highlight on heart -->
    <path d="M 27.5 21.5 C 24.5 21.5 22 24 22 27 C 22 29 23.5 32 25.5 34 C 24.5 32 24.5 28 26.5 25.5 C 27.5 24 29 23 30.5 22.5 C 29 21.8 28 21.5 27.5 21.5 Z"
          fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Glass Reflection Sheen -->
  <path d="M 18 22 C 22 22 22 52 18 52" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" fill="none" />
</svg>